services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////data/gpx_editor.db
      # Strava: register an app at https://www.strava.com/settings/api
      # (Authorization Callback Domain: localhost) and set these.
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN:-}
      - STRAVA_REDIRECT_URI=${STRAVA_REDIRECT_URI:-http://localhost:8090/api/strava/callback}
      - APP_URL=${APP_URL:-http://localhost:8090}
      # Optional. Anything added to .env must be listed here too, or the
      # container never sees it however many times the stack is restarted.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BRIEFING_MODEL=${BRIEFING_MODEL:-}
      - TRIPADVISOR_API_KEY=${TRIPADVISOR_API_KEY:-}
      - OVERPASS_BASE=${OVERPASS_BASE:-}
      # Elevation: which source "Fill elevation" uses by default (open-meteo,
      # opentopodata-eudem25m, opentopodata-srtm30m), and an optional self-hosted
      # OpenTopoData server to get past the public one's 1 call/s limit.
      - ELEVATION_PROVIDER=${ELEVATION_PROVIDER:-}
      - OPENTOPODATA_BASE=${OPENTOPODATA_BASE:-}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped
