services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////data/gpx_editor.db
      # Strava: register an app at https://www.strava.com/settings/api
      # (Authorization Callback Domain: localhost) and set these.
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN:-}
      - STRAVA_REDIRECT_URI=${STRAVA_REDIRECT_URI:-http://localhost:8090/api/strava/callback}
      - APP_URL=${APP_URL:-http://localhost:8090}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped
