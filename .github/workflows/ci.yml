name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app
        continue-on-error: true # advisory until the codebase is fully annotated

      - name: Tests
        run: pytest

      - name: App imports cleanly
        # Catches broken routers and import cycles that unit tests can miss,
        # since a failure here means the container would not start. Asserts on
        # the OpenAPI paths, which are stable across FastAPI versions.
        run: |
          python - <<'PY'
          from app.main import app

          paths = app.openapi()["paths"]
          required = [
              "/api/health",
              "/api/projects",
              "/api/projects/{project_id}/boundaries",
          ]
          missing = [p for p in required if p not in paths]
          assert not missing, f"missing endpoints: {missing}"
          assert len(paths) >= 40, f"only {len(paths)} paths registered; a router likely failed to load"
          print(f"{len(paths)} endpoints registered")
          PY

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # tsconfig already sets noEmit, so -b alone type-checks without
        # depending on the --build/--noEmit combination being legal.
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: gpx-editor-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: gpx-editor-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stack starts and serves
        # Compose alone proves the images build; this proves they actually run
        # and talk to each other, which is what a broken nginx proxy would break.
        run: |
          docker network create gpxci
          docker run -d --name backend --network gpxci gpx-editor-backend:ci
          docker run -d --name frontend --network gpxci -p 8090:80 gpx-editor-frontend:ci

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/ >/dev/null; then break; fi
            sleep 2
          done

          echo "--- frontend ---"
          curl -sf -o /dev/null -w 'index: %{http_code}\n' http://localhost:8090/
          echo "--- api through the nginx proxy ---"
          curl -sf -o /dev/null -w 'api:   %{http_code}\n' http://localhost:8090/api/projects

      - name: Container logs on failure
        if: failure()
        run: |
          echo "--- backend ---";  docker logs backend  2>&1 | tail -50
          echo "--- frontend ---"; docker logs frontend 2>&1 | tail -50
