name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed CVEs in unchanged dependencies still surface.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Uploading SARIF needs GitHub code scanning, which is free on public repos
  # but requires Advanced Security on private ones. This repo is private, so
  # the scanners below report to the job log and fail the build instead. When
  # code scanning is available the results also go to the Security tab.
  capabilities:
    name: Detect available features
    runs-on: ubuntu-latest
    outputs:
      code-scanning: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/${{ github.repository }}" --jq '.visibility' || echo unknown)
          ghas=$(gh api "repos/${{ github.repository }}" \
                   --jq '.security_and_analysis.advanced_security.status // "unknown"' || echo unknown)
          echo "visibility=$visibility  advanced_security=$ghas"
          override="${{ vars.ENABLE_CODE_SCANNING }}"
          if [ "$visibility" = "public" ] || [ "$ghas" = "enabled" ] || [ "$override" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code scanning is available; SARIF will be uploaded."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Code scanning unavailable on a private repo without Advanced Security. Scanners will report in the log and fail on findings instead."
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: capabilities
    if: needs.capabilities.outputs.code-scanning == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit still leaks

      - name: Scan history for committed secrets
        # The gitleaks binary is MIT; the gitleaks-action wrapper carries a
        # commercial EULA for organisation-owned repos, so we skip the wrapper.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1

      - name: Assert .env is not tracked
        # This repo keeps live Strava credentials in .env. gitleaks catches known
        # token shapes; this catches the file itself regardless of its contents.
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error file=.env::.env is tracked by git - it holds the Strava client secret"
            exit 1
          fi
          echo ".env is not tracked"

  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Audit pinned dependencies
        run: pip-audit --requirement requirements.txt --strict --progress-spinner=off

  node-deps:
    name: Node dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit
        # Fails on high/critical only. Transitive dev-only advisories in the Vite
        # toolchain are noisy and don't reach the served app.
        run: npm audit --audit-level=high

  containers:
    name: Container scan (${{ matrix.name }})
    needs: capabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: gpx-editor-${{ matrix.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report HIGH and CRITICAL
        # Visible in the job log without code scanning. Report-only: base images
        # pick up HIGH CVEs regularly and a red build for every one of them just
        # trains you to ignore it.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gpx-editor-${{ matrix.name }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true # base-image CVEs with no patch aren't actionable here
          exit-code: "0"

      - name: Fail on CRITICAL
        # These are rare on slim/alpine once unfixed ones are excluded, so this
        # gate should stay quiet until something genuinely needs attention.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gpx-editor-${{ matrix.name }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Also produce SARIF for the Security tab
        if: always() && needs.capabilities.outputs.code-scanning == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gpx-editor-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && needs.capabilities.outputs.code-scanning == 'true'
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  config:
    name: Config and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan Dockerfiles, compose and nginx config
        # Report-only for now: the baseline is unknown, and Trivy flags things
        # like "container runs as root" that need a real decision about the
        # SQLite volume's ownership first. Set exit-code to 1 once the findings
        # here have been triaged.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  dependency-review:
    name: Dependency review
    needs: capabilities
    runs-on: ubuntu-latest
    # The dependency review API needs the dependency graph, which on a private
    # repo means Advanced Security - the same gate as code scanning.
    if: >-
      github.event_name == 'pull_request' &&
      needs.capabilities.outputs.code-scanning == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
